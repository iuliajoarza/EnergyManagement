version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - proxy-network

  # Postgres for microservice 1
  db1:
    image: postgres:16
    container_name: db1
    restart: always
    environment:
      POSTGRES_USER: iulia
      POSTGRES_PASSWORD: iulia
      POSTGRES_DB: testdb1
    ports:
      - "5435:5432"
    volumes:
      - db1-data:/var/lib/postgresql/data
    networks:
      - proxy-network

  # Postgres for microservice 2
  db2:
    image: postgres:16
    container_name: db2
    restart: always
    environment:
      POSTGRES_USER: iulia
      POSTGRES_PASSWORD: iulia
      POSTGRES_DB: testdb2
    ports:
      - "5434:5432"
    volumes:
      - db2-data:/var/lib/postgresql/data
    networks:
      - proxy-network

  # Postgres for AuthService
  db-auth:
    image: postgres:16
    container_name: db-auth
    restart: always
    environment:
      POSTGRES_USER: iulia
      POSTGRES_PASSWORD: iulia
      POSTGRES_DB: authdb
    volumes:
      - db-auth-data:/var/lib/postgresql/data
    networks:
      - proxy-network

  # Python Simulator Service - DISABLED, use run_simulator.sh instead
  # simulator:
  #   build:
  #     context: ./simulation/simulator
  #     dockerfile: Dockerfile
  #   container_name: simulator
  #   depends_on:
  #     - rabbitmq
  #   networks:
  #     - proxy-network
  #   # Optional env SIM_DEVICE_ID can be set if you use compose directly
  #   # environment:
  #   #   - SIM_DEVICE_ID=CHANGE_ME_DEVICE_ID

  # Monitoring Microservice
  monitoring:
    build:
      context: ./monitoring
      dockerfile: Dockerfile
    container_name: monitoring
    depends_on:
      - rabbitmq
      - monitoring-db
    ports:
      - "8090:8080"
    environment:
      - DB_IP=monitoring-db
      - DB_PORT=5432
      - DB_USER=iulia
      - DB_PASSWORD=iulia
      - DB_DBNAME=monitoring_db
      - RABBITMQ_HOST=rabbitmq
    networks:
      - proxy-network

  # WebSocket Microservice for real-time notifications
  websocket-service:
    build:
      context: ./websocket
      dockerfile: Dockerfile
    container_name: websocket-service
    depends_on:
      - rabbitmq
    ports:
      - "8085:8085"
    environment:
      - RABBITMQ_HOST=rabbitmq
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.websocket.rule=Host(`localhost`) && PathPrefix(`/ws`)"
      - "traefik.http.routers.websocket.entrypoints=web"
      - "traefik.http.services.websocket.loadbalancer.server.port=8085"
      - "traefik.http.routers.websocket.priority=50"
    networks:
      - proxy-network

  # Customer Support (Chat) Microservice
  chat-service:
    build:
      context: ./chat
      dockerfile: Dockerfile
    container_name: chat-service
    depends_on:
      - rabbitmq
    ports:
      - "8086:8086"
    environment:
      - RABBITMQ_HOST=rabbitmq
      - AI_ENABLED=true
      - HUGGINGFACE_API_KEY=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
      - HUGGINGFACE_MODEL=google/flan-t5-small
      - HUGGINGFACE_INSECURE=true
    networks:
      - proxy-network

  # Spring Boot microservice 1
  spring-demo1:
    build:
      context: ./demo
      dockerfile: Dockerfile
    image: backend-image1
    container_name: spring-demo1
    ports:
      - "8081:8080"
    environment:
      - DB_IP=db1
      - DB_PORT=5432
      - DB_DBNAME=testdb1
      - DB_USER=iulia
      - DB_PASSWORD=iulia
      - PORT=8080
      - AUTH_SERVICE_BASE_URL=http://auth-service:8080
      - JWT_SECRET=${JWT_SECRET:-iuliaiuliaiuliaiuliaiuliaiulia01112003}
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      - db1
      - rabbitmq
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.people.rule=Host(`localhost`) && PathPrefix(`/api/user`)"
      - "traefik.http.routers.people.entrypoints=web"
      - "traefik.http.services.people.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.strip-people.stripprefix.prefixes=/api"
      - "traefik.http.routers.people.middlewares=strip-people"
      - "traefik.http.routers.people.priority=100"
    networks:
      - proxy-network

# PostgreSQL for Monitoring Microservice
  monitoring-db:
    image: postgres:16
    container_name: monitoring-db
    restart: always
    environment:
      POSTGRES_USER: iulia
      POSTGRES_PASSWORD: iulia
      POSTGRES_DB: monitoring_db
    ports:
      - "5436:5432"
    volumes:
      - monitoring-db-data:/var/lib/postgresql/data
    networks:
      - proxy-network

  # Spring Boot microservice 2
  spring-demo2:
    build:
      context: ./microserviceDevice
      dockerfile: Dockerfile
    image: backend-image2
    container_name: spring-demo2
    ports:
      - "8082:8080"  # Expose for Swagger UI access
    environment:
      - DB_IP=db2
      - DB_PORT=5432
      - DB_DBNAME=testdb2
      - DB_USER=iulia
      - DB_PASSWORD=iulia
      - PORT=8080
      - USER_SERVICE_BASE_URL=http://spring-demo1:8080
      - JWT_SECRET=${JWT_SECRET:-iuliaiuliaiuliaiuliaiuliaiulia01112003}
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      - db2
      - rabbitmq
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.devices.rule=Host(`localhost`) && PathPrefix(`/api/device`)"
      - "traefik.http.routers.devices.entrypoints=web"
      - "traefik.http.services.devices.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.strip-device.stripprefix.prefixes=/api"
      - "traefik.http.routers.devices.middlewares=strip-device"
      - "traefik.http.routers.devices.priority=10"
    networks:
      - proxy-network

  # AuthService
  auth-service:
    build:
      context: ./AuthService
      dockerfile: Dockerfile
    image: backend-image3
    container_name: auth-service
    ports:
      - "8083:8080"  # Expose for Swagger UI access
    environment:
      - DB_IP=db-auth
      - DB_PORT=5432
      - DB_DBNAME=authdb
      - DB_USER=iulia
      - DB_PASSWORD=iulia
      - PORT=8080
      - JWT_SECRET=${JWT_SECRET:-iuliaiuliaiuliaiuliaiuliaiulia01112003}
    depends_on:
      - db-auth
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=Host(`localhost`) && PathPrefix(`/api/auth`)"
      - "traefik.http.routers.auth.entrypoints=web"
      - "traefik.http.services.auth.loadbalancer.server.port=8080"
      - "traefik.http.routers.auth.priority=10"
    networks:
      - proxy-network

  # Traefik reverse proxy
  traefik:
    image: traefik:v2.11
    container_name: traefik
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic:/etc/traefik/dynamic:ro
      - ./logs:/var/log/traefik
    networks:
      - proxy-network

  # Frontend service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://localhost
    image: frontend:latest
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`localhost`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
    networks:
      - proxy-network
    depends_on:
      - spring-demo1
      - spring-demo2
      - auth-service

volumes:
  db1-data:
  db2-data:
  db-auth-data:
  postgres_demo1_data:
  postgres_demo2_data:
  postgres_auth_data:
  monitoring-db-data:

networks:
  proxy-network:
    driver: bridge


