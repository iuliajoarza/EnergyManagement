http:
  middlewares:
    auth-basic:
      basicAuth:
        users:
          - "user:$apr1$H6uskkkW$IgXLP6ewTrSuBkTrqE8wj/"
    strip-people-prefix:
      stripPrefix:
        prefixes:
          - "/api"
    strip-devices-prefix:
      stripPrefix:
        prefixes:
          - "/api"
    strip-auth-prefix:
      stripPrefix:
        prefixes:
          - "/api"
    strip-monitoring-prefix:
      stripPrefix:
        prefixes:
          - "/api"
    strip-usercache-prefix:
      stripPrefix:
        prefixes:
          - "/api"

  services:
    people-service:
      loadBalancer:
        servers:
          - url: "http://spring-demo1:8080"
    devices-service:
      loadBalancer:
        servers:
          - url: "http://spring-demo2:8080"
    auth-service:
      loadBalancer:
        servers:
          - url: "http://auth-service:8080"
    monitoring-service:
      loadBalancer:
        servers:
          - url: "http://monitoring:8080"
    simulator-service:
      loadBalancer:
        servers:
          - url: "http://simulator:80"
    rabbitmq-service:
      loadBalancer:
        servers:
          - url: "http://rabbitmq:15672"
  

  routers:
    
      

    people-api:
      rule: "Host(`localhost`) && PathPrefix(`/api/user`)"
      entryPoints:
        - web
      service: people-service
      middlewares:
        - "strip-people-prefix@file"
      priority: 10

    devices-api:
      rule: "Host(`localhost`) && PathPrefix(`/api/device`)"
      entryPoints:
        - web
      service: devices-service
      middlewares:
        - "strip-devices-prefix@file"
      priority: 10

    usercache-api:
      rule: "Host(`localhost`) && PathPrefix(`/api/usercache`)"
      entryPoints:
        - web
      service: devices-service
      middlewares:
        - "strip-usercache-prefix@file"
      priority: 15

    auth-api:
      rule: "Host(`localhost`) && PathPrefix(`/api/auth`)"
      entryPoints:
        - web
      service: auth-service
    monitoring-api:
      rule: "Host(`localhost`) && PathPrefix(`/api/monitoring`)"
      entryPoints:
        - web
      service: monitoring-service
      middlewares:
        - "strip-monitoring-prefix@file"
      priority: 10
    simulator-api:
      rule: "Host(`localhost`) && PathPrefix(`/api/simulator`)"
      entryPoints:
        - web
      service: simulator-service
      priority: 5
    rabbitmq-api:
      rule: "Host(`localhost`) && PathPrefix(`/rabbitmq`)"
      entryPoints:
        - web
      service: rabbitmq-service
      priority: 10
      middlewares:
        - "strip-auth-prefix@file"
