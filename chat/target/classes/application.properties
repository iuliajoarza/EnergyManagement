server.port=8086
spring.application.name=customer-support-service

# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Chat Configuration
chat.queue.incoming=chat.user.messages
chat.queue.outgoing=chat.bot.responses
chat.exchange=chat.exchange

# Admin Chat Configuration
admin.queue.incoming=admin.messages
admin.queue.outgoing=chat.bot.responses
admin.user.queue=admin.user.messages

# AI Configuration (optional - for bonus points)
ai.enabled=${AI_ENABLED:false}

# HuggingFace AI Configuration
huggingface.api.key=${HUGGINGFACE_API_KEY:}
huggingface.model=${HUGGINGFACE_MODEL:mistral-7b-instruct}
huggingface.insecure=${HUGGINGFACE_INSECURE:false}

# Gemini AI Configuration
gemini.api.key=AIzaSyBJm0kod238iZADsTYEoqY4kU3S9Owz6b0

# Google API Key (for Gemini SDK)
google.api.key=AIzaSyBJm0kod238iZADsTYEoqY4kU3S9Owz6b0

# Logging
logging.level.com.example.chat=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
